# =============================================================================
# DEMAND FORECASTING MLOPS
# =============================================================================
# Shared PostgreSQL, Redis, MinIO with separate databases for MLflow, Airflow, Optuna
# =============================================================================

# -----------------------------------------------------------------------------
# SHARED INFRASTRUCTURE SERVICES
# -----------------------------------------------------------------------------

x-common-env:
  # PostgreSQL Environment - Use environment variables for security
  # SECURITY: Never use default credentials in production!
  # Set these in your .env file before deployment
  &common-env
  POSTGRES_USER: ${POSTGRES_USER:-airflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_MULTIPLE_DATABASES: "airflow,mlflow,optuna"

  # Redis Environment - Use environment variables for security
  REDIS_PASSWORD: ${REDIS_PASSWORD}

  # MinIO Environment
  MINIO_ROOT_USER: ${MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

x-airflow-common: &airflow-common
  build: .
  env_file:
    - .env
  environment:
    <<: *common-env
    PYTHONPATH: /opt/airflow/src
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    # Email Configuration for Alerts
    AIRFLOW__EMAIL__EMAIL_BACKEND: "airflow.utils.email.send_email_smtp"
    AIRFLOW__SMTP__SMTP_HOST: "smtp.gmail.com"
    AIRFLOW__SMTP__SMTP_STARTTLS: "true"
    AIRFLOW__SMTP__SMTP_SSL: "false"
    AIRFLOW__SMTP__SMTP_PORT: "587"
    AIRFLOW__SMTP__SMTP_MAIL_FROM: "airflow@demand-forecasting.local"
    # Remote Logging to MinIO
    AIRFLOW__LOGGING__REMOTE_LOGGING: "true"
    AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER: "s3://airflow-logs"
    AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID: "minio_s3"
    # Celery Configuration using shared Redis
    AIRFLOW__CELERY__BROKER_URL: redis://redis:6379/0
    AIRFLOW__CELERY__RESULT_BACKEND: redis://redis:6379/0
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./conf:/opt/airflow/conf
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./scripts:/opt/airflow/scripts
    - ./conf/local/airflow_passwords.json:/opt/airflow/airflow_passwords.json
    - ./pyproject.toml:/opt/airflow/pyproject.toml
    - ./tmp/catboost_info:/opt/airflow/catboost_info # Writable directory for CatBoost temp files
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    minio:
      condition: service_started

services:
  # -----------------------------------------------------------------------------
  # SHARED POSTGRESQL - Single instance with multiple databases
  # -----------------------------------------------------------------------------
  postgres:
    image: postgres:15.1-alpine
    container_name: postgres_container
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB
    env_file:
      - .env
    environment:
      <<: *common-env
      POSTGRES_DB: airflow # Default database for Airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize multiple databases
      - ./scripts/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/01-init-multiple-dbs.sh
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # -----------------------------------------------------------------------------
  # SHARED REDIS - Single instance for both MLflow caching and Airflow Celery
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      <<: *common-env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mlops-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M

  # -----------------------------------------------------------------------------
  # SHARED MINIO - Single instance for both MLflow artifacts and Airflow logs
  # -----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      <<: *common-env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - mlops-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # -----------------------------------------------------------------------------
  # MLFLOW TRACKING SERVER
  # -----------------------------------------------------------------------------
  mlflow:
    image: python:3.11-slim
    command: [ "/bin/bash", "/opt/airflow/mlflow-entrypoint.sh" ]
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
      - ./mlflow-entrypoint.sh:/opt/airflow/mlflow-entrypoint.sh
    environment:
      <<: *common-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import http.client; conn = http.client.HTTPConnection('localhost', 5000); conn.request('GET', '/health'); exit(0) if conn.getresponse().status == 200 else exit(1)" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - mlops-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 512M

  # -----------------------------------------------------------------------------
  # AIRFLOW SERVICES
  # -----------------------------------------------------------------------------

  # Airflow Database Initialization
  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
      _AIRFLOW_WWW_USER_ROLE: "Admin"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops-network

  # Airflow Web Server
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - mlops-network

  # Airflow Scheduler
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    networks:
      - mlops-network

  # Airflow Worker (Celery) - DISABLED for LocalExecutor
  # With LocalExecutor, tasks run in the scheduler process, no worker needed
  airflow-worker:
    <<: *airflow-common
    command: version # Just prints version and exits (placeholder)
    profiles:
      - celery # Only starts when 'celery' profile is active
    hostname: ${CELERY_WORKER_HOSTNAME:-airflow-worker}
    healthcheck:
      test: [ "CMD", "echo", "ok" ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - mlops-network

  # Airflow Triggerer (for async triggers)
  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: [ "CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"' ]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - mlops-network

  # -----------------------------------------------------------------------------
  # MINIO BUCKET CREATION
  # -----------------------------------------------------------------------------
  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_USER: ${MINIO_ROOT_USER}
      MINIO_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        /usr/bin/mc alias set myminio http://minio:9000 $MINIO_USER $MINIO_PASSWORD;
        /usr/bin/mc mb myminio/demand-forecasting --ignore-existing;
        /usr/bin/mc mb myminio/mlflow-artifacts --ignore-existing;
        /usr/bin/mc mb myminio/airflow-logs --ignore-existing;
        /usr/bin/mc mb myminio/drift-reports --ignore-existing;
        /usr/bin/mc mb myminio/clearml-artifacts --ignore-existing;
        echo 'Buckets created with private access (default). Use IAM policies for production access control.';
        exit 0;
      "
    networks:
      - mlops-network

  # -----------------------------------------------------------------------------
  # MODEL SERVER (FastAPI)
  # -----------------------------------------------------------------------------
  model-server:
    build:
      context: .
      dockerfile: Dockerfile.model-server.ultra-optimized
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      <<: *common-env
      MODEL_SERVER_HOST: "0.0.0.0"
      MODEL_SERVER_PORT: "8000"
      METRICS_PORT: "8001"
      MLFLOW_TRACKING_URI: "http://mlflow:5000"
      LOG_LEVEL: "INFO"
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./data:/app/data
      - ./src:/app/src # Mount source for development hot-reload
    depends_on:
      - postgres
      - redis
      - mlflow
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - mlops-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # -----------------------------------------------------------------------------
  # TEST RUNNER SERVICE
  # -----------------------------------------------------------------------------
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.model-server.ultra-optimized
    command: [ "python", "-m", "pytest", "tests", "-v", "--tb=short", "--cov=src/demand_forecasting", "--cov-report=html", "--cov-report=term-missing", "--cov-report=json", "--junit-xml=test_results.xml" ]
    volumes:
      - ./tests:/app/tests
      - ./src:/app/src
      - ./test_reports:/app/test_reports
    environment:
      <<: *common-env
      PYTHONPATH: /app/src
      TEST_MODE: true
    depends_on:
      - postgres
      - redis
      - minio
      - mlflow
    profiles:
      - testing
    networks:
      - mlops-network

  # -----------------------------------------------------------------------------
  # NGINX LOAD BALANCER
  # -----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      model-server:
        condition: service_started # Changed from service_healthy to allow startup without model
    restart: unless-stopped
    networks:
      - mlops-network

  # -----------------------------------------------------------------------------
  # PROMETHEUS MONITORING
  # -----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    depends_on:
      model-server:
        condition: service_started # Changed from service_healthy
    restart: unless-stopped
    networks:
      - mlops-network

  # -----------------------------------------------------------------------------
  # GRAFANA DASHBOARDS
  # -----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped
    networks:
      - mlops-network

  # -----------------------------------------------------------------------------
  # CLEARML SERVER STACK
  # -----------------------------------------------------------------------------

  clearml-mongo:
    image: mongo:4.4
    container_name: clearml-mongo
    volumes:
      - clearml_mongo_data:/data/db
    networks:
      - mlops-network
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  clearml-elastic:
    image: elasticsearch:7.17.0
    container_name: clearml-elastic
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    volumes:
      - clearml_elastic_data:/usr/share/elasticsearch/data
    networks:
      - mlops-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1536M
    restart: unless-stopped

  clearml-apiserver:
    image: clearml/server:latest
    container_name: clearml-apiserver
    command: apiserver
    ports:
      - "8008:8008"
    depends_on:
      clearml-mongo:
        condition: service_healthy
      clearml-elastic:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      CLEARML_HOST_IP: ${CLEARML_HOST_IP:-localhost}
      CLEARML_MONGODB_SERVICE_HOST: clearml-mongo
      CLEARML_MONGODB_SERVICE_PORT: 27017
      CLEARML_ELASTIC_SERVICE_HOST: clearml-elastic
      CLEARML_ELASTIC_SERVICE_PORT: 9200
      CLEARML_REDIS_SERVICE_HOST: redis
      CLEARML_REDIS_SERVICE_PORT: 6379
      CLEARML_REDIS_SERVICE_PASSWORD: ${REDIS_PASSWORD}
      CLEARML_SERVER_DEPLOYMENT_TYPE: linux
    volumes:
      - ./clearml_config:/opt/clearml/config
    networks:
      mlops-network:
        aliases:
          - apiserver
    restart: unless-stopped

  clearml-webserver:
    image: clearml/server:latest
    container_name: clearml-webserver
    command: webserver
    ports:
      - "8082:80"
    depends_on:
      - clearml-apiserver
    environment:
      CLEARML__APISERVER__HOST: http://clearml-apiserver:8008
    networks:
      - mlops-network
    restart: unless-stopped

  clearml-fileserver:
    image: clearml/server:latest
    container_name: clearml-fileserver
    command: fileserver
    ports:
      - "8083:8081"
    volumes:
      - clearml_files:/mnt/fileserver
    depends_on:
      - clearml-apiserver
    networks:
      mlops-network:
        aliases:
          - fileserver
    restart: unless-stopped

  # -----------------------------------------------------------------------------
  # OPTUNA DASHBOARD
  # -----------------------------------------------------------------------------

  optuna-dashboard:
    image: ghcr.io/optuna/optuna-dashboard:latest
    container_name: optuna-dashboard
    ports:
      - "8084:8080"
    command: [ "postgresql://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD}@postgres:5432/optuna" ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mlops-network
    restart: unless-stopped

  # -----------------------------------------------------------------------------
  # NODE EXPORTER (Host Metrics for Grafana)
  # -----------------------------------------------------------------------------

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - mlops-network
    restart: unless-stopped

# -----------------------------------------------------------------------------
# NAMED VOLUMES
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  mlflow_data:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  clearml_mongo_data:
    driver: local
  clearml_elastic_data:
    driver: local
  clearml_files:
    driver: local

# -----------------------------------------------------------------------------
# NETWORKS
# -----------------------------------------------------------------------------
networks:
  mlops-network:
    driver: bridge
    name: demand-forecasting-network
