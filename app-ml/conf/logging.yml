version: 1
disable_existing_loggers: false

formatters:
  simple:
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"
  detailed:
    format: "%(asctime)s | %(name)s | %(levelname)s | %(filename)s:%(lineno)d | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  
  file_handler:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/info.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

root:
  level: INFO
  handlers: [console]

loggers:
  kedro:
    level: WARNING
    handlers: [console]
    propagate: false
  
  kedro.io:
    level: WARNING
    handlers: [console]
    propagate: false
  
  demand_forecasting:
    level: INFO
    handlers: [console]
    propagate: false
  
  # Suppress verbose loggers
  urllib3:
    level: WARNING
  botocore:
    level: WARNING
  s3fs:
    level: WARNING
  aiobotocore:
    level: WARNING
  great_expectations:
    level: ERROR
  pandera:
    level: WARNING
  mlflow:
    level: INFO
  catboost:
    level: WARNING
  optuna:
    level: WARNING
