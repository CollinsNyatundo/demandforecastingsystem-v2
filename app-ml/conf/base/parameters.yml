# -----------------------------------------------------------------------------
# Pipeline Parameters - Demand Forecasting
# -----------------------------------------------------------------------------

# Train/test split
train_fraction: 0.8

# Data processing
data_processing:
  random_state: 42

# Feature engineering (lag features; matches notebook cnt_lag and feature lags)
feature_engineering:
  demand_lags: [1, 2, 22, 23]
  feature_lags:
    hour: [1, 2, 3]
    day_of_week: [1, 2, 3]
    weather_condition: [1, 2, 3]
    temp: [1, 2, 3]
    humidity: [1, 2, 3]

# Optuna hyperparameter optimization
optuna:
  n_trials: 150
  primary_model: catboost
  catboost_search_space:
    learning_rate:
      min: 0.01
      max: 0.3
    depth:
      min: 4
      max: 12
    l2_leaf_reg:
      min: 1.0
      max: 10.0
    n_estimators:
      min: 100
      max: 500
    min_data_in_leaf:
      min: 5
      max: 50

# Advanced features (multi-objective, ensemble)
advanced_features:
  enable_multi_objective: true
  enable_ensemble: true
  multi_objective_trials: 50
  objectives:
    - rmse
    - mae
  preference_weights:
    rmse: 0.6
    mae: 0.4
  ensemble_type: stacking

# Model training defaults (for ensemble fallback)
model_training:
  catboost:
    iterations: 500
    learning_rate: 0.1
    depth: 6
    random_state: 42

# Dataset / data docs (for pipeline nodes that use params)
dataset_name: preprocessed_bike_data
data_docs_dir: data_docs
enable_data_docs: false

# Monitoring & automation (for automated_retraining_dag)
monitoring:
  drift_threshold: 0.1

automation:
  time_interval_days: 7
  performance_threshold: 5.0
  data_volume_threshold: 10000
