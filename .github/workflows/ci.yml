name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ==========================================
  # Code Quality Checks
  # ==========================================
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app-ml
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit safety
      
      - name: Run Ruff linter
        run: |
          ruff check src --output-format=github
      
      - name: Run Ruff formatter check
        run: |
          ruff format --check src
      
      - name: Run type checker (mypy)
        run: |
          mypy src/demand_forecasting
        continue-on-error: true  # Don't fail build on type errors initially
      
      - name: Run security checks (Bandit)
        run: |
          bandit -r src -f json -o bandit-report.json
          bandit -r src  # Human readable output
      
      - name: Check dependency vulnerabilities (Safety)
        run: |
          safety check --output json > safety-report.json || true
          safety check || true  # Human readable output
        continue-on-error: true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ==========================================
  # Unit Tests
  # ==========================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    
    defaults:
      run:
        working-directory: ./app-ml
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run tests with coverage
        run: |
          pytest -m "not integration and not slow" \
                 --cov=src/demand_forecasting \
                 --cov-report=xml \
                 --cov-report=term-missing \
                 --cov-fail-under=35 \
                 -v
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./app-ml/coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}
          fail_ci_if_error: false

  # ==========================================
  # Data Validation Tests
  # ==========================================
  data-validation:
    name: Data Pipeline Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app-ml
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      
      - name: Run data validation tests
        run: |
          python tests/import_validation.py
          python tests/local_validation.py

  # ==========================================
  # Integration Tests
  # ==========================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: ./app-ml
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name: Run integration tests
        run: |
          pytest tests/test_integration.py --no-cov -v

  # ==========================================
  # UI Code Quality Checks
  # ==========================================
  lint-ui:
    name: Lint UI Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app-ui
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff bandit
      
      - name: Run Ruff linter
        run: |
          ruff check . --output-format=github
      
      - name: Run Ruff formatter check
        run: |
          ruff format --check .
      
      - name: Run security checks (Bandit)
        run: |
          bandit -r . -f json -o bandit-report.json --exclude ./tests
          bandit -r . --exclude ./tests  # Human readable output
        continue-on-error: true

  # ==========================================
  # UI Tests
  # ==========================================
  test-ui:
    name: UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app-ui
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      
      - name: Run UI tests
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing
      
      - name: Test health endpoint
        run: |
          python -c "
          import sys
          sys.path.insert(0, '..')
          from app import server, app_state
          with server.test_client() as client:
              # Test health endpoint
              resp = client.get('/health')
              assert resp.status_code == 200, f'Health check failed: {resp.status_code}'
              data = resp.get_json()
              assert data['status'] == 'healthy', f'Unexpected status: {data}'
              print('Health endpoint: OK')
              
              # Test metrics endpoint
              resp = client.get('/metrics')
              assert resp.status_code == 200, f'Metrics check failed: {resp.status_code}'
              print('Metrics endpoint: OK')
          print('All endpoint tests passed!')
          "

  # ==========================================
  # Security Scan
  # ==========================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ==========================================
  # Build Docker Images (on main branch)
  # ==========================================
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test, integration, lint-ui, test-ui]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build ML service image
        uses: docker/build-push-action@v5
        with:
          context: ./app-ml
          file: ./app-ml/Dockerfile
          push: false
          tags: demand-forecasting-ml:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Build UI service image
        uses: docker/build-push-action@v5
        with:
          context: ./app-ui
          file: ./app-ui/Dockerfile
          push: false
          tags: demand-forecasting-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
