# Pre-commit hooks configuration for demand forecasting project
# Ensures code quality before commits

repos:
  # ==========================================
  # Python code formatting and linting
  # ==========================================
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      # Run Ruff linter
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
      
      # Run Ruff formatter
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  # ==========================================
  # Type checking
  # ==========================================
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports, --explicit-package-bases]
        types: [python]

  # ==========================================
  # Security scanning
  # ==========================================
  - repo: https://github.com/pycqa/bandit
    rev: 1.9.3
    hooks:
      - id: bandit
        args: [-r, src, -f, json, -o, bandit-report.json]
        pass_filenames: false
        # Run bandit check separately for human-readable output
        verbose: true

  # ==========================================
  # General file quality checks
  # ==========================================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Check for large files
      - id: check-added-large-files
        args: [--maxkb=1000]
      
      # Check for merge conflicts
      - id: check-merge-conflict
      
      # Check for broken symlinks
      - id: check-symlinks
      
      # Check for executable files with shebangs
      - id: check-executables-have-shebangs
      
      # Remove trailing whitespace
      - id: trailing-whitespace
      
      # End files with newline
      - id: end-of-file-fixer
      
      # Check YAML syntax
      - id: check-yaml
        args: [--unsafe]
      
      # Check JSON syntax
      - id: check-json
      
      # Check TOML syntax
      - id: check-toml
      
      # Check for private keys
      - id: detect-private-key
      
      # Check for AWS credentials
      - id: detect-aws-credentials
      
      # Check for case conflicts
      - id: check-case-conflict

# Configuration options
default_language_version:
  python: python3.11

# Fail fast - stop on first failure (set to false for comprehensive checks)
fail_fast: false

# Minimum pre-commit version
minimum_pre_commit_version: 3.2.0
